<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <!-- 背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2b2b2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3c3f41;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 主背景 -->
  <rect width="800" height="200" fill="url(#bgGradient)" />
  <!-- 网格线装饰 -->
  <g stroke="#4a4a4a" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="160" y1="0" x2="160" y2="200" />
    <line x1="320" y1="0" x2="320" y2="200" />
    <line x1="480" y1="0" x2="480" y2="200" />
    <line x1="640" y1="0" x2="640" y2="200" />
  </g>
  <!-- 左侧终端窗口 -->
  <rect x="60" y="50" width="220" height="120" rx="5" ry="5" fill="#1e1e1e" stroke="#4a4a4a" stroke-width="2" filter="url(#dropShadow)" />
  <rect x="60" y="50" width="220" height="20" rx="5" ry="5" fill="#323232" stroke="#4a4a4a" stroke-width="1" />
  <circle cx="70" cy="60" r="3" fill="#ff5f56" />
  <circle cx="80" cy="60" r="3" fill="#ffbd2e" />
  <circle cx="90" cy="60" r="3" fill="#27c93f" />
  <text x="170" y="64" font-family="Courier New, monospace" font-size="10" fill="#e0e0e0" text-anchor="middle">nc</text>
  <!-- 命令行内容 -->
  <text x="70" y="85" font-family="Courier New, monospace" font-size="10" fill="#27c93f">$</text>
  <text x="82" y="85" font-family="Courier New, monospace" font-size="10" fill="#e0e0e0">nc -l 8080</text>
  <text x="70" y="105" font-family="Courier New, monospace" font-size="10" fill="#27c93f">$</text>
  <text x="82" y="105" font-family="Courier New, monospace" font-size="10" fill="#e0e0e0">nc 192.168.1.10 8080</text>
  <text x="70" y="125" font-family="Courier New, monospace" font-size="10" fill="#e0e0e0">Listening...</text>
  <text x="70" y="145" font-family="Courier New, monospace" font-size="10" fill="#60a0ff">Data received ▮</text>
  <!-- 右侧终端窗口 -->
  <rect x="520" y="50" width="220" height="120" rx="5" ry="5" fill="#1e1e1e" stroke="#4a4a4a" stroke-width="2" filter="url(#dropShadow)" />
  <rect x="520" y="50" width="220" height="20" rx="5" ry="5" fill="#323232" stroke="#4a4a4a" stroke-width="1" />
  <circle cx="530" cy="60" r="3" fill="#ff5f56" />
  <circle cx="540" cy="60" r="3" fill="#ffbd2e" />
  <circle cx="550" cy="60" r="3" fill="#27c93f" />
  <text x="630" y="64" font-family="Courier New, monospace" font-size="10" fill="#e0e0e0" text-anchor="middle">socat</text>
  <!-- 命令行内容 -->
  <text x="530" y="85" font-family="Courier New, monospace" font-size="10" fill="#27c93f">$</text>
  <text x="542" y="85" font-family="Courier New, monospace" font-size="10" fill="#e0e0e0">socat TCP-LISTEN:8080 -</text>
  <text x="530" y="105" font-family="Courier New, monospace" font-size="10" fill="#27c93f">$</text>
  <text x="542" y="105" font-family="Courier New, monospace" font-size="10" fill="#e0e0e0">socat - TCP:10.0.0.1:80</text>
  <text x="530" y="125" font-family="Courier New, monospace" font-size="10" fill="#60a0ff">Socket established</text>
  <text x="530" y="145" font-family="Courier New, monospace" font-size="10" fill="#e0e0e0">Forwarding data... ▮</text>
  <!-- 中间连接线 -->
  <path d="M280 100 C340 100, 340 60, 400 100 C460 140, 460 100, 520 100" stroke="#60a0ff" stroke-width="3" fill="none" stroke-dasharray="5,5" />
  <circle cx="280" cy="100" r="4" fill="#60a0ff" />
  <circle cx="520" cy="100" r="4" fill="#60a0ff" />
  <!-- 数据包动画 -->
  <circle cx="350" cy="100" r="5" fill="#60a0ff">
    <animate attributeName="cx" values="300;450" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="100" r="4" fill="#55cc55">
    <animate attributeName="cx" values="480;370" dur="1.7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite" />
  </circle>
</svg>

